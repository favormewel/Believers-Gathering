<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHRIST HUB Admin</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#FDF3E3;color:#222;font:14px/1.4 system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
[hidden]{display:none!important}button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2F5BD8;outline-offset:2px}
#wrap{display:flex;flex-wrap:wrap;min-height:100vh}
aside{flex:0 0 220px;background:#2B2118;padding:20px 12px;display:flex;flex-direction:column;gap:6px}
aside h1{margin:0 0 14px;padding:0 12px;color:#fff;font-size:17px}aside h1 span{color:#E2B04E}
aside button,aside a{min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:#fff;font-weight:600;text-align:left;display:flex;align-items:center;text-decoration:none}
aside button.on{background:#8A5A0B}
main{flex:1 1 320px;padding:24px;display:flex;flex-direction:column;gap:20px;min-width:0}
h2{margin:0;font-size:19px}.sub{color:#6B6055;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat,.panel{background:#FFFAF2;border:1px solid #F0E2C8;border-radius:14px;padding:14px}
.stat b{display:block;font-size:24px;color:#8A5A0B}
.panel h3{margin:0 0 8px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F0E2C8;flex-wrap:wrap}
.row p{margin:2px 0 0;font-size:13px}.row small{color:#6B6055}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:22px;font-weight:700;background:#E2B04E;color:#222}
.btn.out{background:none;border:1.5px solid #B3261E;color:#B3261E}
.badge{padding:2px 10px;border-radius:10px;background:#FBE3C2;color:#A06A0E;font-size:12px;font-weight:700}
#gate{max-width:380px;margin:12vh auto;padding:20px}
#gate .panel{padding:20px}label{display:block;margin-bottom:12px;font-weight:700}
input{width:100%;height:44px;margin-top:4px;padding:0 14px;border:1px solid #F0E2C8;border-radius:12px;background:#fff;font:16px system-ui,sans-serif}
.note{padding:10px 14px;border-radius:12px;background:#F8E19B;font-size:13px}
.err{color:#B3261E;font-weight:700;min-height:20px;margin:6px 0}
</style></head><body>
<div id="gate" hidden><div class="panel"><h2>CHRIST HUB Admin</h2><p class="sub">Sign in with an admin account.</p>
<label>Email<input id="a-email" type="email" autocomplete="email"></label>
<label>Password<input id="a-pass" type="password" autocomplete="current-password"></label>
<div id="a-msg" class="err" role="alert"></div><button class="btn" id="a-btn" style="width:100%">Sign in</button></div></div>
<div id="wrap" hidden>
<aside><h1>CHRIST HUB <span>Admin</span></h1>
<button class="on" data-p="dash">Dashboard</button><button data-p="groups">Groups</button><button data-p="members">Members</button><a href="index.html">Back to the app</a><button id="out" hidden>Sign out</button></aside>
<main>
<div id="sample" class="note" hidden>Sample data. Add your Supabase details in config.js to manage real data.</div>
<section id="p-dash"><h2>Dashboard</h2><div class="stats" style="margin:12px 0 20px"><div class="stat"><span class="sub">Members</span><b id="s-mem">0</b></div><div class="stat"><span class="sub">Groups</span><b id="s-grp">0</b></div><div class="stat"><span class="sub">Prayer requests to review</span><b id="s-pr">0</b></div></div>
<div class="panel"><h3>Prayer requests to review</h3><div id="l-pr"></div></div></section>
<section id="p-groups" hidden><h2>Groups</h2><div class="panel" style="margin-top:12px"><div id="l-grp"></div></div></section>
<section id="p-members" hidden><h2>Members</h2><div class="panel" style="margin-top:12px"><div id="l-mem"></div></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
function $(i){return document.getElementById(i)}
var C=window.FAITHLINK_CONFIG||{},live=C.SUPABASE_URL&&C.SUPABASE_URL.indexOf("YOUR_")!==0&&window.supabase,db=live?supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY):null;
function row(main,sub,btns){var d=document.createElement("div");d.className="row";var l=document.createElement("div"),b=document.createElement("b");b.textContent=main;l.appendChild(b);
  if(sub){var p=document.createElement("p");p.textContent=sub;l.appendChild(p)}d.appendChild(l);(btns||[]).forEach(function(x){d.appendChild(x)});return d}
function btn(t,cls,fn){var b=document.createElement("button");b.className="btn "+cls;b.textContent=t;b.onclick=fn;return b}
function empty(el,t){el.innerHTML="";var p=document.createElement("p");p.className="sub";p.textContent=t;el.appendChild(p)}
function setPr(list){var el=$("l-pr");el.innerHTML="";$("s-pr").textContent=list.length;if(!list.length){empty(el,"Nothing waiting for review.");return}
  list.forEach(function(r){var wrap=document.createElement("div");
    function done(){wrap.remove();var n=el.querySelectorAll(".row").length;$("s-pr").textContent=n;if(!n)empty(el,"Nothing waiting for review.")}
    function set(status){if(!db){done();return}db.from("prayer_requests").update({status:status}).eq("id",r.id).then(function(x){if(x.error)alert("Could not update. Please try again.");else done()})}
    wrap.appendChild(row((r.author||"Anonymous")+(r.group_name?" \u00b7 "+r.group_name:""),r.body,[btn("Approve","",function(){set("approved")}),btn("Remove","out",function(){set("removed")})]));el.appendChild(wrap)})}
function setGroups(list){var el=$("l-grp");el.innerHTML="";$("s-grp").textContent=list.length;if(!list.length){empty(el,"No groups yet.");return}
  list.forEach(function(g){var wrap=document.createElement("div");
    wrap.appendChild(row(g.name,(g.members||0)+" member"+(g.members===1?"":"s")+(g.description?" \u00b7 "+g.description:""),[btn("Delete","out",function(){if(!confirm("Delete "+g.name+" and all its messages?"))return;
      if(!db){wrap.remove();return}db.from("groups").delete().eq("id",g.id).then(function(x){if(x.error)alert("Could not delete.");else wrap.remove()})})]));el.appendChild(wrap)})}
function setMembers(list){var el=$("l-mem");el.innerHTML="";$("s-mem").textContent=list.length;if(!list.length){empty(el,"No members yet.");return}
  list.forEach(function(m){var r=row(m.full_name||"Member","",m.is_admin?[Object.assign(document.createElement("span"),{className:"badge",textContent:"Admin"})]:[]);el.appendChild(r)})}
function sample(){$("sample").hidden=false;$("wrap").hidden=false;
  setPr([{id:1,author:"Grace",group_name:"Anonymous",body:"Pray for a job opening. I have been searching for months."},{id:2,author:"Ruth",group_name:"Hope Group",body:"Our family is moving cities. Pray for peace and a new church home."}]);
  setGroups([{id:1,name:"Bukoto Youth Bible Study",members:34,description:"Thursday study"},{id:2,name:"Makerere CU Prayer Warriors",members:42}]);
  setMembers([{full_name:"Favor Mewel",is_admin:true},{full_name:"Grace N."},{full_name:"David K."}])}
function load(){
  db.from("prayer_requests").select("id,author,group_name,body").eq("status","pending").order("created_at",{ascending:false}).limit(50).then(function(r){setPr(r.data||[])});
  db.from("groups").select("id,name,description,group_members(count)").order("created_at").then(function(r){setGroups((r.data||[]).map(function(g){return{id:g.id,name:g.name,description:g.description,members:g.group_members&&g.group_members[0]?g.group_members[0].count:0}}))});
  db.from("profiles").select("full_name,is_admin").order("full_name").then(function(r){setMembers(r.data||[])})}
function enter(user){db.from("profiles").select("is_admin").eq("id",user.id).single().then(function(r){
  if(r.data&&r.data.is_admin){$("gate").hidden=true;$("wrap").hidden=false;$("out").hidden=false;load()}
  else{$("gate").hidden=false;$("wrap").hidden=true;$("a-msg").textContent="This account is not an admin.";db.auth.signOut()}})}
document.addEventListener("click",function(e){var p=e.target.closest("[data-p]");if(p){document.querySelectorAll("[data-p]").forEach(function(b){b.className=b===p?"on":""});["dash","groups","members"].forEach(function(k){$("p-"+k).hidden=k!==p.dataset.p})}
  if(e.target.id==="a-btn"){var em=$("a-email").value.trim(),pw=$("a-pass").value;if(!em||!pw){$("a-msg").textContent="Enter your email and password.";return}
    db.auth.signInWithPassword({email:em,password:pw}).then(function(r){if(r.error){$("a-msg").textContent="Sign-in failed. Check your email and password.";return}$("a-msg").textContent="";enter(r.data.user)})}
  if(e.target.id==="out")db.auth.signOut().then(function(){location.reload()})});
if(!db)sample();else db.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)enter(s.user);else $("gate").hidden=false});
})();
</script></body></html>
